services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: smart_garden
    volumes:
      - garden_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden -d smart_garden"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://garden:${POSTGRES_PASSWORD}@db:5432/smart_garden
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      retries: 3
    restart: unless-stopped
volumes:
  garden_db:
